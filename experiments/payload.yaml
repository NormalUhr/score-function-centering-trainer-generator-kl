    group: Lst4
    seeds: [0]
    overrides: rl.num_prompts=64 async.trainer_prompts=4 eval.every_steps=400 eval.save_samples=8 rl.is.level=null rl.sc=true sampler.vocab_logprobs=8 rl.sampler_kl.coeff=0.3 async.queue_depth=4 rl.seq_len=4096 async.chunk_tokens=128 async.decode_rows=64 stop.steps=3200 sampler.tail_samples=8
