# SFC, SFC+TIS, SFC+MIS and SFC+KL in the seven asynchronous settings of Part 3 (sections 2 to 4
# and 6): Qwen3-0.6B on Countdown with 4-prompt and 2-prompt trainer slices (SGD), on Countdown
# with AdamW and on GSM8K (4-prompt slices), and Qwen3-4B, Qwen3-30B-A3B and GLM-4.5-Air on
